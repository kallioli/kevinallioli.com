name: renovate

# Self-hosted rather than the Mend app: nothing outside this repository gets
# write access to it, which is the same rule the site itself applies.
#
# This cron is the schedule. renovate.json deliberately carries no `schedule`
# of its own: two gates that have to agree is how a bot ends up never running.

on:
  schedule:
    # Monday, 04:00 UTC. Early enough in Europe/Zurich to be waiting on Monday.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        type: choice
        default: info
        options: [info, debug]
      dryRun:
        description: Report what would change without opening pull requests
        type: boolean
        default: false

# Renovate writes with RENOVATE_TOKEN, never with the workflow token, so the
# workflow token stays read-only.
permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
