name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily, to keep the contributions register in step with Gerrit. The
  # refresh happens inside this workflow rather than in one of its own: a
  # push made with GITHUB_TOKEN starts no workflow run, so a separate job
  # committing the register would never reach a deploy. Here the same run
  # regenerates, commits, builds and publishes, which also means the data in
  # the repository is by construction the data that was served.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded pull request run is waste and can be dropped. A run on main
  # may be holding a half-finished `wrangler deploy`, so it is left to finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only the scheduled refresh writes, and only to data/contributions.yaml.
      contents: write
    outputs:
      register-changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fetched before the build so that the build is what validates it: a
      # status Gerrit reports and the register layout does not handle fails
      # here, exactly as it would for a hand-written edit.
      - name: Refresh the contributions register
        id: refresh
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          ./scripts/fetch-contributions.sh
          if git diff --quiet -- data/contributions.yaml; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "register unchanged"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git --no-pager diff --stat -- data/contributions.yaml
          fi

      - name: Install pinned Hugo extended
        run: |
          set -euo pipefail
          version="$(cat .hugo-version)"
          tarball="hugo_extended_${version}_linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${version}/${tarball}"
          sha256sum --check .hugo-sha256
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Report Hugo version
        run: hugo version

      - name: Build
        env:
          HUGO_PARAMS_BUILDCOMMIT: ${{ github.sha }}
        # A warning here is a build failure: deprecated APIs and missing
        # layouts are the two things that rot a hand-written template set.
        run: hugo --minify --gc --cleanDestinationDir --printPathWarnings --panicOnWarning

      - name: Verify the CSP hash matches the served HTML
        run: ./scripts/check-csp-hash.sh public

      # Only now, with the site built and verified against the refreshed data,
      # is it worth recording. Nothing unverified reaches main.
      - name: Commit the refreshed register
        if: github.event_name == 'schedule' && steps.refresh.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.yaml
          git commit -m "chore(contributions): refresh the register from Gerrit"
          # Fail rather than force. A rejected push means someone pushed in
          # the meantime, and tomorrow's run picks the register up again.
          git push origin HEAD:main

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: public/
          retention-days: 7

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repository history
        run: gitleaks detect --no-banner --redact --verbose

  deploy:
    # Publishing is off until the repository variable DEPLOY_ENABLED is set to
    # "true". Until then a push to main builds and verifies, and stops there.
    # A scheduled run publishes only when the refresh actually moved the
    # register. Nothing else changes on a timer, so there is nothing else to
    # publish.
    if: >-
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && needs.build.outputs.register-changed == 'true')) &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    needs: [build, secrets-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://kevinallioli.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: public

      - name: Publish to Cloudflare Workers Static Assets
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.0"
          command: deploy

      # The deploy itself only proves wrangler was happy. This proves the
      # origin serves the headers this build generated, and that the www
      # redirect rule (a zone rule, not in this repository) still exists.
      - name: Smoke-test the deployment
        run: ./scripts/smoke-test.sh
