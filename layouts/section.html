{{ define "main" }}
<div class="prose-wrap">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  {{- with .Pages }}
  <ul class="entry-list">
    {{- range . }}{{ partial "entry.html" (dict "page" . "level" 2) }}{{ end }}
  </ul>
  {{- end }}
</div>
{{ end }}
